name: Setup Wippy
description: Install a pinned Wippy CLI release from the Wippy Hub and verify its sha256.

inputs:
  version:
    description: Wippy release version, e.g. 0.3.43a
    required: true
  channel:
    description: Release channel
    default: stable
  hub-url:
    description: Wippy Hub base URL
    default: https://hub.wippy.ai

runs:
  using: composite
  steps:
    - name: Install wippy ${{ inputs.version }}
      shell: bash
      env:
        WIPPY_VERSION: ${{ inputs.version }}
        WIPPY_CHANNEL: ${{ inputs.channel }}
        WIPPY_HUB_URL: ${{ inputs.hub-url }}
      run: |
        set -euo pipefail
        case "$(uname -s)" in Linux) os=linux ;; Darwin) os=darwin ;; *) echo "unsupported OS" >&2; exit 1 ;; esac
        case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) echo "unsupported arch" >&2; exit 1 ;; esac
        meta=$(curl --proto '=https' --tlsv1.2 -fsSL --retry 3 "$WIPPY_HUB_URL/api/v1/releases/$WIPPY_VERSION?channel=$WIPPY_CHANNEL")
        expected=$(printf '%s' "$meta" | jq -r --arg os "$os" --arg arch "$arch" '.assets[] | select(.platform==$os and .arch==$arch) | .sha256' | head -n1)
        test -n "$expected"
        bin_dir="$RUNNER_TOOL_CACHE/wippy/$WIPPY_VERSION"
        mkdir -p "$bin_dir"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$bin_dir/wippy" \
          "$WIPPY_HUB_URL/api/v1/releases/$WIPPY_VERSION/download/$os/$arch?channel=$WIPPY_CHANNEL"
        echo "$expected  $bin_dir/wippy" | sha256sum -c -
        chmod +x "$bin_dir/wippy"
        echo "$bin_dir" >> "$GITHUB_PATH"
