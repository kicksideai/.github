# Individual CLA enforcement for contributors outside the organization.
# Members of the kicksideai organization are exempt: the PR author's
# membership is checked with the CLA_TOKEN organization secret (scope
# read:org) and the signature steps are skipped for members. All other
# authors must sign the CLA. The same token (scope repo) writes the
# signatures to the private .github-private repository.
name: CLA

'on':
  workflow_call:
    secrets:
      CLA_TOKEN:
        required: true

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  check:
    name: Contributor license agreement
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read and agree to the KickSide Individual Contributor License Agreement, Version 1.1.'))
    runs-on: ubuntu-24.04
    steps:
    - name: Check organization membership
      id: membership
      env:
        GH_TOKEN: ${{ secrets.CLA_TOKEN }}
        AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      run: |
        set -euo pipefail
        status=$(curl -sS -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/orgs/kicksideai/members/${AUTHOR}")
        case "${status}" in
          204)
            echo "member=true" >> "${GITHUB_OUTPUT}"
            echo "Organization member: CLA not required (@${AUTHOR})." >> "${GITHUB_STEP_SUMMARY}"
            ;;
          404)
            echo "member=false" >> "${GITHUB_OUTPUT}"
            ;;
          *)
            echo "Unexpected membership response ${status} for @${AUTHOR}" >&2
            exit 1
            ;;
        esac
    - name: Check contributor agreement
      if: steps.membership.outputs.member != 'true'
      uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
      with:
        path-to-signatures: signatures/kickside-cla-v1.1.json
        path-to-document: https://github.com/kicksideai/.github/blob/main/CLA.md
        branch: main
        allowlist: "*[bot]"
        remote-organization-name: kicksideai
        remote-repository-name: .github-private
        custom-pr-sign-comment: "I have read and agree to the KickSide Individual Contributor License Agreement, Version 1.1."
        custom-notsigned-prcomment: >-
          Read the KickSide Individual Contributor License Agreement at
          https://github.com/kicksideai/.github/blob/main/CLA.md, then comment
          `I have read and agree to the KickSide Individual Contributor License
          Agreement, Version 1.1.` to record your agreement.
